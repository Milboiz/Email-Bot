<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const MODEL = "claude-sonnet-4-6";   // single source of truth for the Claude model
const TONES = ["Professional","Friendly","Consultative","Bold"];
const TONE_DESC = {Professional:"Polished, formal",Friendly:"Warm, conversational",Consultative:"Value-focused",Bold:"Direct, persuasive"};
const POLL_INTERVAL = 5 * 60 * 1000; // 5 min
const DEFAULT_FOLLOWUP_DAYS = 5;     // business days

// Triage categories. `stop` marks the ones that permanently halt follow-ups.
const CATEGORIES = [
  {key:"Interested",     label:"Interested",     rank:0, stop:false, bg:"#ecfdf5", fg:"#166534"},
  {key:"Question",       label:"Question",       rank:1, stop:false, bg:"#eff6ff", fg:"#1d4ed8"},
  {key:"Referral",       label:"Referral",       rank:2, stop:true,  bg:"#f5f3ff", fg:"#6d28d9"},
  {key:"Not Interested", label:"Not Interested", rank:3, stop:true,  bg:"#fef2f2", fg:"#991b1b"},
  {key:"Wrong Person",   label:"Wrong Person",   rank:4, stop:true,  bg:"#fff7ed", fg:"#c2410c"},
  {key:"Unsubscribe",    label:"Unsubscribe",    rank:5, stop:true,  bg:"#fef2f2", fg:"#7f1d1d"},
  {key:"Auto-Reply",     label:"Auto-Reply",     rank:6, stop:false, bg:"#f3f4f6", fg:"#4b5563"},
  {key:"Other",          label:"Other",          rank:7, stop:false, bg:"#f3f4f6", fg:"#4b5563"},
];
const CAT = Object.fromEntries(CATEGORIES.map(c=>[c.key,c]));
const CATEGORY_KEYS = CATEGORIES.map(c=>c.key);

// ── Generic helpers ────────────────────────────────────────────────────────

function initials(name) {
  return (name||"?").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

function uid() { return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`; }

/** Whole business days (Mon-Fri) elapsed between an ISO timestamp and now. */
function businessDaysSince(iso, now = new Date()) {
  if (!iso) return 0;
  const start = new Date(iso);
  if (isNaN(start)) return 0;
  const a = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (b <= a) return 0;
  let days = 0;
  const cur = new Date(a);
  while (cur < b) {
    cur.setDate(cur.getDate() + 1);
    const d = cur.getDay();
    if (d !== 0 && d !== 6) days++;
  }
  return days;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}

function notify(title, body, onClick) {
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    const n = new Notification(title, {body, icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%236366f1'/><text x='16' y='21' text-anchor='middle' fill='white' font-size='16'>✉</text></svg>"});
    if (onClick) n.onclick = onClick;
  }
}

// ── Gmail ──────────────────────────────────────────────────────────────────

function buildRaw(from, to, subject, body, extraHeaders = {}) {
  const lines = [`From: ${from}`, `To: ${to}`, `Subject: ${subject}`];
  Object.entries(extraHeaders).forEach(([k,v]) => { if (v) lines.push(`${k}: ${v}`); });
  lines.push(`MIME-Version: 1.0`, `Content-Type: text/plain; charset=utf-8`, ``, body);
  const bytes = new TextEncoder().encode(lines.join("\r\n"));
  let bin=""; bytes.forEach(b=>(bin+=String.fromCharCode(b)));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function gmailSend(token, from, to, subject, body, {threadId, headers} = {}) {
  const payload = { raw: buildRaw(from, to, subject, body, headers || {}) };
  if (threadId) payload.threadId = threadId;   // ask Gmail to nest this in the thread
  const res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{
    method:"POST",
    headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
    body:JSON.stringify(payload),
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||`HTTP ${res.status}`);}
  return res.json();
}

/** Full thread including message bodies — triage needs more than the snippet. */
async function fetchThread(token, threadId) {
  const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/threads/${threadId}?format=full`,{
    headers:{Authorization:`Bearer ${token}`}
  });
  if(!res.ok) return null;
  return res.json();
}

function decodeB64Url(data) {
  try {
    const bin = atob(String(data).replace(/-/g,"+").replace(/_/g,"/"));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  } catch { return ""; }
}

/** Depth-first walk of a Gmail MIME payload, preferring text/plain over stripped HTML. */
function extractBody(payload) {
  if (!payload) return "";
  const plain = [], html = [];
  (function walk(part) {
    if (!part) return;
    const mime = part.mimeType || "";
    if (part.body && part.body.data) {
      if (mime === "text/plain") plain.push(decodeB64Url(part.body.data));
      else if (mime === "text/html") html.push(decodeB64Url(part.body.data));
    }
    (part.parts || []).forEach(walk);
  })(payload);
  let text = plain.join("\n").trim();
  if (!text && html.length) {
    text = html.join("\n")
      .replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<script[\s\S]*?<\/script>/gi," ")
      .replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n").replace(/<[^>]+>/g," ")
      .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
      .replace(/&#39;/g,"'").replace(/&quot;/g,'"');
  }
  // Drop the quoted original so triage classifies only the new content.
  return text
    .split(/\n\s*(?:On .+ wrote:|-----Original Message-----|_{10,}|From:\s)/)[0]
    .replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

function header(msg, name) {
  const h = (msg?.payload?.headers || []).find(x => x.name.toLowerCase() === name.toLowerCase());
  return h ? h.value : "";
}

function messageId(msg) {
  return header(msg, "Message-Id") || header(msg, "Message-ID") || null;
}

/** First inbound message in a thread (i.e. not from the user), with body + threading id. */
async function findReply(token, threadId, myEmail) {
  const thread = await fetchThread(token, threadId);
  if (!thread || !thread.messages || thread.messages.length < 2) return null;
  const mine = (myEmail || "").toLowerCase();
  if (!mine) return null;
  const reply = thread.messages.find(m => !header(m, "From").toLowerCase().includes(mine));
  if (!reply) return null;
  return {
    snippet: reply.snippet || "",
    bodyText: extractBody(reply.payload) || reply.snippet || "",
    from: header(reply, "From"),
    subject: header(reply, "Subject"),
    receivedAt: reply.internalDate ? new Date(Number(reply.internalDate)).toISOString() : new Date().toISOString(),
    messageCount: thread.messages.length,
  };
}

/** Message-ID of the newest message in a thread — for In-Reply-To on follow-ups. */
async function threadTailMessageId(token, threadId) {
  const res = await fetch(
    `https://gmail.googleapis.com/gmail/v1/users/me/threads/${threadId}?format=metadata&metadataHeaders=Message-Id`,
    { headers:{Authorization:`Bearer ${token}`} }
  );
  if (!res.ok) return null;
  const thread = await res.json().catch(()=>null);
  const msgs = thread?.messages || [];
  return msgs.length ? messageId(msgs[msgs.length-1]) : null;
}

// ── Claude ─────────────────────────────────────────────────────────────────

/** Pull a JSON object/array out of a response that may be fenced or prefaced. */
function extractJSON(text) {
  let t = String(text).trim();
  if (t.includes("```")) {
    const parts = t.replace(/```json/gi,"```").split("```");
    t = (parts.find(s => s.trim().startsWith("{") || s.trim().startsWith("[")) || t).trim();
  }
  const candidates = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
  if (candidates.length) t = t.slice(Math.min(...candidates));
  const end = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (end >= 0) t = t.slice(0, end + 1);
  return JSON.parse(t);
}

async function callClaude(apiKey, prompt, maxTokens = 1000) {
  if (!apiKey || !apiKey.trim()) throw new Error("No Anthropic API key set");
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey.trim(),
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
    },
    body:JSON.stringify({model:MODEL,max_tokens:maxTokens,messages:[{role:"user",content:prompt}]}),
  });
  if(!res.ok){
    const errData = await res.json().catch(()=>({}));
    throw new Error(errData?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||"").join("");
}

async function callClaudeJSON(apiKey, prompt, maxTokens = 1000) {
  return extractJSON(await callClaude(apiKey, prompt, maxTokens));
}

function contactBlock(c) {
  return [
    `- Name: ${c.name}`,
    `- Email: ${c.email}`,
    c.company  ? `- Company: ${c.company}` : "",
    c.jobTitle ? `- Job title: ${c.jobTitle}` : "",
    c.linkedIn ? `- LinkedIn: ${c.linkedIn}` : "",
    c.notes    ? `- Notes: ${c.notes}` : "",
  ].filter(Boolean).join("\n");
}

function coldEmailPrompt(campaign, userEmail, contact) {
  return `You are an expert sales copywriter. Write a highly personalized cold outreach email.

Sender: ${campaign.senderName} (${userEmail})
Product/Service: ${campaign.product}
Tone: ${campaign.tone}
${campaign.subjectHint?`Subject direction: ${campaign.subjectHint}`:""}

Recipient:
${contactBlock(contact)}

Write a concise, genuine email (3-4 paragraphs). Avoid generic openers like "I hope this email finds you well". Reference specific details about the recipient where possible. End with one clear, low-friction CTA (e.g. a question, not "schedule a call").

Respond ONLY as JSON, no markdown:
{"subject": "...", "body": "..."}`;
}

function followUpPrompt(campaign, userEmail, rec, daysWaited) {
  const attempt = (rec.followUpCount || 0) + 1;
  return `You are an expert sales copywriter writing a FOLLOW-UP to a cold outreach email that got no reply.

Sender: ${campaign.senderName} (${userEmail})
Product/Service: ${campaign.product}
Tone: ${campaign.tone}

Recipient:
${contactBlock(rec.contact)}

The original email, sent ${daysWaited} business day(s) ago, was:
Subject: ${rec.subject}
${rec.body}

This is follow-up number ${attempt}. They have not replied.

Write a SHORT follow-up (2-3 sentences, at most one short paragraph). Rules:
- Do not guilt-trip. Do not write "just bumping this", "circling back", or "following up on my last email".
- Add something genuinely new: a different angle, a concrete example, or a sharper reason it is relevant to them specifically.
- End with one very low-friction question that is easy to answer in a single line.
- It sends as a reply in the same thread, so do not re-introduce yourself at length.
${attempt >= 2 ? "- This is the last planned touch. Make it graceful and give them an easy out." : ""}

Respond ONLY as JSON, no markdown:
{"subject": "...", "body": "..."}`;
}

function triagePrompt(rec, reply) {
  return `You are triaging replies to a cold outreach campaign.

We emailed ${rec.contact.name}${rec.contact.company?` at ${rec.contact.company}`:""}.
Our subject line was: ${rec.subject}

They replied with:
"""
${(reply.bodyText || reply.snippet || "").slice(0, 4000)}
"""

Classify the reply into EXACTLY ONE of these categories:
- "Interested" — positive signal, wants to talk, asks for a call/demo/pricing with intent
- "Question" — engaged but asking something before committing
- "Referral" — pointing us to a different person or team to talk to instead
- "Not Interested" — a clear no, but not a demand to stop contacting
- "Wrong Person" — they are not the right contact, or have left the company
- "Unsubscribe" — explicitly asks to stop being contacted / remove me / do not email again
- "Auto-Reply" — out of office, autoresponder, ticket acknowledgement; no human wrote it
- "Other" — fits none of the above

Also write a one-line summary (max 15 words, no trailing period) capturing the actionable content.
If the category is "Referral", include the name and/or email they pointed to if present.

Respond ONLY as JSON, no markdown:
{"category": "...", "summary": "..."}`;
}

function callPrepPrompt(campaign, userEmail, contact, history) {
  return `You are prepping ${campaign.senderName} for a short call with a prospect. Be specific and useful, not generic.

Caller: ${campaign.senderName} (${userEmail})
What they sell: ${campaign.product}
Tone to strike: ${campaign.tone}

The prospect:
${contactBlock(contact)}
${history
  ? `\nPrior contact with this person:\n- We emailed them on ${fmtDate(history.sentAt)} with subject "${history.subject}"\n${history.triage?.category ? `- They replied, categorised as "${history.triage.category}": ${history.triage.summary}` : "- They have not replied"}`
  : "\nNo prior email contact with this person."}

Write a call-prep brief with exactly three parts:
1. "who" — 2-3 sentences on who they are and what their role likely cares about day to day. Base it strictly on the details given; where a detail is unknown, say what you would ask rather than inventing facts.
2. "hook" — 2-3 sentences on the most relevant, specific angle to lead with for THIS person, and why it should land.
3. "opener" — one or two sentences of actual spoken opening line, in first person, that the caller can say almost verbatim. Natural spoken English, not written prose. Do not use "I hope I'm not catching you at a bad time".

Respond ONLY as JSON, no markdown:
{"who": "...", "hook": "...", "opener": "..."}`;
}

// ── CSV parsing ────────────────────────────────────────────────────────────

/** Split one CSV line, respecting double-quoted fields that contain commas. */
function splitCSVLine(line) {
  const out = []; let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; } else inQuotes = false;
      } else cur += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(v => v.trim());
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = splitCSVLine(lines[0]).map(h=>h.trim().toLowerCase().replace(/[^a-z]/g,""));
  return lines.slice(1).map(line => {
    const vals = splitCSVLine(line);
    const obj = {};
    // splitCSVLine already unwraps enclosing quotes and unescapes "" — don't strip again.
    headers.forEach((h,i)=>{ obj[h]=vals[i]||""; });
    return {
      id: uid(),
      name: obj.name||obj.fullname||obj.firstname||"",
      email: obj.email||obj.emailaddress||"",
      company: obj.company||obj.organization||"",
      jobTitle: obj.jobtitle||obj.title||obj.role||"",
      linkedIn: obj.linkedin||obj.linkedinurl||"",
      notes: obj.notes||obj.note||"",
    };
  }).filter(c=>c.name&&c.email);
}

// ── Small components ───────────────────────────────────────────────────────

function StatusPill({status}) {
  if(!status) return null;
  if(status==="pending") return <span className="status-pill pill-pending"><span className="spin">⟳</span>Sending</span>;
  if(status==="sent") return <span className="status-pill pill-sent">✓ Sent</span>;
  if(status==="replied") return <span className="status-pill pill-replied">💬 Replied</span>;
  if(status==="error"||status.startsWith("error")) return <span className="status-pill pill-error">✗ Failed</span>;
  return null;
}

function Tag({category}) {
  const meta = CAT[category] || CAT["Other"];
  return <span className="tag" style={{background:meta.bg,color:meta.fg}}>{meta.label}</span>;
}

function Spinner() { return <span className="spin" style={{color:"#9198b0",fontSize:16}}>⟳</span>; }

function Empty({title, hint}) {
  return (
    <div style={{textAlign:"center",padding:"3rem 1rem",color:"#9198b0"}}>
      <p style={{fontSize:16,marginBottom:8}}>{title}</p>
      {hint && <p className="small">{hint}</p>}
    </div>
  );
}

function ContactLine({contact, right}) {
  return (
    <div className="flex-between">
      <div className="flex-row gap-10">
        <div className="avatar avatar-sm">{initials(contact.name)}</div>
        <div style={{minWidth:0}}>
          <p style={{fontSize:14,fontWeight:500}}>{contact.name}</p>
          <p className="small muted" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {contact.email}{contact.company?` · ${contact.company}`:""}{contact.jobTitle?` · ${contact.jobTitle}`:""}
          </p>
        </div>
      </div>
      <div className="flex-row gap-8" style={{flexShrink:0}}>{right}</div>
    </div>

}

/** Editable subject/body pair, shared by the cold-email and follow-up review flows. */
function DraftEditor({subject, body, onEdit, disabled, rows=7}) {
  return (
    <div style={{borderTop:"1px solid #e4e7f0",paddingTop:10,marginTop:10,display:"flex",flexDirection:"column",gap:8}}>
      <div>
        <label className="muted small" style={{marginBottom:3}}>Subject</label>
        <input value={subject} onChange={e=>onEdit("subject",e.target.value)} disabled={disabled}/>
      </div>
      <div>
        <label className="muted small" style={{marginBottom:3}}>Body</label>
        <textarea value={body} onChange={e=>onEdit("body",e.target.value)} disabled={disabled} rows={rows} style={{resize:"vertical"}}/>
      </div>
    </div>

}

// ── Email Review Card (cold email compose flow) ────────────────────────────

function EmailCard({item, index, status, onEdit, onRegenerate, disabled}) {
  const [regenerating, setRegenerating] = useState(false);
  const [expanded, setExpanded] = useState(true);

  const handleRegen = async () => {
    setRegenerating(true);
    await onRegenerate(index);
    setRegenerating(false);
  };

  const cardClass = `email-card fade-in${status==="sent"?" sent":""}${status&&status.startsWith("error")?" error":""}`;

  return (
    <div className={cardClass}>
      <ContactLine contact={item.contact} right={<>
        <StatusPill status={status}/>
        {item.loading && <Spinner/>}
        {!item.loading && !disabled && (
          <button className="btn-ghost" onClick={handleRegen} disabled={regenerating} title="Regenerate this email">
            {regenerating?<span className="spin">⟳</span>:"↺"} Redo
          </button>
        )}
        {!item.loading && (
          <button className="btn-icon" onClick={()=>setExpanded(e=>!e)} title={expanded?"Collapse":"Expand"}>
            {expanded?"▲":"▼"}
          </button>
        )}
      </>}/>

      {!item.loading && expanded && (
        <DraftEditor subject={item.subject} body={item.body}
          onEdit={(f,v)=>onEdit(index,f,v)} disabled={disabled||regenerating}/>
      )}
    </div>
  );
}

// ── Follow-up Card ─────────────────────────────────────────────────────────

function FollowUpCard({rec, days, draft, onGenerate, onEdit, onSend, onSkip, sending, apiKeyMissing}) {

  return (
    <div className={`email-card fade-in ${draft?.sent?"sent":"due"}`}>
      <ContactLine contact={rec.contact} right={<>
        {draft?.sent
          ? <span className="status-pill pill-sent">✓ Follow-up sent</span>
          : <span className="status-pill pill-due">⏳ {days}d quiet</span>}
        {rec.followUpCount > 0 && !draft?.sent && (
          <span className="small muted">{rec.followUpCount} prior</span>
        )}
        {busy && <Spinner/>}
        <button className="btn-icon" onClick={()=>setExpanded(e=>!e)} title={expanded?"Collapse":"Show original"}>
          {expanded?"▲":"▼"}
        </button>
      </>}/>

      <p className="small muted mt-8" style={{paddingLeft:40}}>
        Last contacted {fmtDate(rec.lastContactedAt || rec.sentAt)} · “{rec.subject}”
      </p>

      {expanded && (
        <div style={{borderTop:"1px solid #e4e7f0",paddingTop:10,marginTop:10}}>
          <p className="small muted" style={{whiteSpace:"pre-wrap",maxHeight:180,overflow:"auto"}}>{rec.body}</p>
        </div>
      )}

      {!draft?.sent && (
        <div className="flex-row gap-8 mt-12" style={{justifyContent:"flex-end"}}>
          <button className="btn-ghost" onClick={()=>onSkip(rec.id)} disabled={busy}>Skip for now</button>
          <button className="btn-secondary" onClick={()=>onGenerate(rec.id)} disabled={busy||apiKeyMissing}>
            {draft?.loading ? <><span className="spin">⟳</span>Writing…</> : draft ? "↺ Redo" : "✦ Draft follow-up"}
          </button>
          {draft && !draft.loading && (
            <button className="btn-send" onClick={()=>onSend(rec.id)} disabled={busy}>
              {sending ? <><span className="spin">⟳</span>Sending…</> : "➤ Send reply"}

      )}

// ── localStorage ───────────────────────────────────────────────────────────

const LS_KEYS = ["eob_apiKey","eob_clientId","eob_campaign","eob_contacts","eob_sentHistory","eob_userEmail"];

function lsGet(key, fallback) {
  try { const v=localStorage.getItem(key); return v!==null ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function lsClear() { LS_KEYS.forEach(k=>localStorage.removeItem(k)); }

const EMPTY_CAMPAIGN = {senderName:"",product:"",tone:"Professional",subjectHint:"",followUpDays:DEFAULT_FOLLOWUP_DAYS};

// ── Main App ───────────────────────────────────────────────────────────────

function App() {
  const [tab, setTab] = useState("setup");
  const [gisReady, setGisReady] = useState(false);
  const [gisError, setGisError] = useState(false);
  const [reconnecting, setReconnecting] = useState(false);

  // ── Persisted state ──
  const [apiKey, setApiKey]     = useState(()=>lsGet("eob_apiKey",""));
  const [clientId, setClientId] = useState(()=>lsGet("eob_clientId",""));
  const [campaign, setCampaign] = useState(()=>({...EMPTY_CAMPAIGN, ...lsGet("eob_campaign",{})}));
  const [contacts, setContacts] = useState(()=>lsGet("eob_contacts",[]));
  // sentHistory is the durable record of every send. One entry per email:
  // {id, contact, subject, body, sentAt, lastContactedAt, threadId, status,
  //  errorMessage, followUpCount, followUps[], doNotContact, reply, triage}
  const [sentHistory, setSentHistory] = useState(()=>lsGet("eob_sentHistory",[]));

  useEffect(()=>lsSet("eob_apiKey",   apiKey),   [apiKey]);
  useEffect(()=>lsSet("eob_clientId", clientId), [clientId]);
  useEffect(()=>lsSet("eob_campaign", campaign), [campaign]);
  useEffect(()=>lsSet("eob_contacts", contacts), [contacts]);
  useEffect(()=>lsSet("eob_sentHistory", sentHistory), [sentHistory]);

  // ── Session-only state ──
  const [token, setToken]       = useState(null);
  const [userEmail, setUserEmail] = useState(()=>lsGet("eob_userEmail",""));
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "default"
  );

  const [newC, setNewC]         = useState({name:"",email:"",company:"",jobTitle:"",linkedIn:"",notes:""});
  const [csvDrag, setCsvDrag]   = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [parsing, setParsing]   = useState(false);
  const [parsedPreview, setParsedPreview] = useState(null);

  const [emails, setEmails]     = useState([]);
  const [generating, setGenerating] = useState(false);
  const [sendStatus, setSendStatus] = useState({});
  const [sending, setSending]   = useState(false);
  const [allSent, setAllSent]   = useState(false);
  const [showClearConfirm, setShowClearConfirm] = useState(false);

  const [followUpDrafts, setFollowUpDrafts] = useState({}); // recId -> {subject, body, loading, sent, error}
  const [sendingFollowUp, setSendingFollowUp] = useState(null);
  const [skipped, setSkipped] = useState([]);               // session-only "not today"

  const [prepContactId, setPrepContactId] = useState(null);
  const [prepBrief, setPrepBrief] = useState(null);
  const [prepLoading, setPrepLoading] = useState(false);
  const [prepError, setPrepError] = useState(null);

  const [polling, setPolling] = useState(false);

  const pollRef   = useRef(null);
  const tokenRef  = useRef(token);
  const apiKeyRef = useRef(apiKey);
  const historyRef= useRef(sentHistory);
  const emailRef  = useRef(userEmail);
  useEffect(()=>{ tokenRef.current=token; },[token]);
  useEffect(()=>{ apiKeyRef.current=apiKey; },[apiKey]);
  useEffect(()=>{ historyRef.current=sentHistory; },[sentHistory]);
  useEffect(()=>{ emailRef.current=userEmail; },[userEmail]);

  const updateRecord = useCallback((id, patch) => {
    setSentHistory(prev => prev.map(r =>
      r.id === id ? {...r, ...(typeof patch === "function" ? patch(r) : patch)} : r
    ));
  }, []);

  // ── Auth ──
  const SCOPES = "https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.email";

  const onAuthSuccess = async(accessToken, silent=false)=>{
    setToken(accessToken);
    const info=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{
      headers:{Authorization:`Bearer ${accessToken}`}
    }).then(r=>r.json()).catch(()=>({}));
    const email=info.email||emailRef.current||"your Gmail account";
    setUserEmail(email);
    lsSet("eob_userEmail", email);
    if(!campaign.senderName&&info.name) setCampaign(p=>({...p,senderName:info.name}));
    if(typeof Notification !== "undefined" && Notification.permission==="default") {
      Notification.requestPermission().then(p=>setNotifPermission(p));
    }
    if(!silent) setTab(historyRef.current.length ? "followups" : "campaign");
  };

  useEffect(()=>{
    if(window.google?.accounts?.oauth2){ setGisReady(true); return; }
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.onload=()=>setGisReady(true);
    s.onerror=()=>setGisError(true);
    document.head.appendChild(s);
  },[]);

  // Silent reconnect on return visits
  useEffect(()=>{
    if(!gisReady||!clientId.trim()) return;
    setReconnecting(true);
    try{
      const client=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId.trim(),
        scope:SCOPES,
        prompt:"",
        callback:async(resp)=>{
          setReconnecting(false);
          if(resp.error||!resp.access_token) return;
          await onAuthSuccess(resp.access_token, true);
          setTab(historyRef.current.length ? "followups" : "campaign");
        },
      });
      client.requestAccessToken({prompt:""});
    }catch{ setReconnecting(false); }
  },[gisReady]);

  const connectGmail = ()=>{
    if(!gisReady||!clientId.trim()) return;
    try{
      const client=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId.trim(),
        scope:SCOPES,
        callback:async(resp)=>{
          if(resp.error){alert(`Auth error: ${resp.error}`);return;}
          await onAuthSuccess(resp.access_token, false);
        },
      });
      client.requestAccessToken();
    }catch(e){alert(`Could not start auth: ${e.message}`);}
  };

  const clearAllData=()=>{
    lsClear();
    setApiKey(""); setClientId(""); setCampaign({...EMPTY_CAMPAIGN});
    setContacts([]); setSentHistory([]); setUserEmail(""); setToken(null);
    setEmails([]); setSendStatus({}); setAllSent(false);
    setFollowUpDrafts({}); setSkipped([]); setPrepBrief(null); setPrepContactId(null);
    setShowClearConfirm(false); setTab("setup");
  };

  // ── Reply polling + triage ──
  // Reads from sentHistory, so it resumes on page load instead of dying with the tab.
  const pollReplies = useCallback(async()=>{
    const t = tokenRef.current;
    if(!t) return;
    const pending = historyRef.current.filter(r => r.threadId && r.status === "sent");
    if(!pending.length) return;
    setPolling(true);
    for(const rec of pending){
      try{
        const reply = await findReply(t, rec.threadId, emailRef.current);
        if(!reply) continue;
        updateRecord(rec.id, {status:"replied", reply});
        notify(`${rec.contact.name} replied!`, reply.snippet || reply.bodyText.slice(0,120), ()=>setTab("replies"));
        // Triage right away when we can. A failure here leaves it untriaged, not lost.
        if(apiKeyRef.current && apiKeyRef.current.trim()){
          try{
            const out = await callClaudeJSON(apiKeyRef.current, triagePrompt(rec, reply), 400);
            const category = CATEGORY_KEYS.includes(out.category) ? out.category : "Other";
            updateRecord(rec.id, {
              triage:{category, summary:(out.summary||"").trim(), triagedAt:new Date().toISOString()},
              doNotContact: CAT[category].stop,
            });
          }catch(err){
            updateRecord(rec.id, {triage:{category:null, summary:"", error:err.message}});
          }
        }
      }catch{ /* transient Gmail error — retry on the next tick */ }
    }
    setPolling(false);
  },[updateRecord]);

  // Poll whenever we're authorised and have unanswered sends.
  const pollableCount = sentHistory.filter(r=>r.threadId && r.status==="sent").length;
  useEffect(()=>{
    if(!token || pollableCount === 0) return;
    pollReplies();
    pollRef.current = setInterval(pollReplies, POLL_INTERVAL);
    return ()=>clearInterval(pollRef.current);
  },[token, pollableCount, pollReplies]);

  const retriage = async(rec)=>{
    if(!apiKey.trim() || !rec.reply) return;
    updateRecord(rec.id, {triage:{category:null, summary:"", loading:true}});
    try{
      const out = await callClaudeJSON(apiKey, triagePrompt(rec, rec.reply), 400);
      const category = CATEGORY_KEYS.includes(out.category) ? out.category : "Other";
      updateRecord(rec.id, {
        triage:{category, summary:(out.summary||"").trim(), triagedAt:new Date().toISOString()},
        doNotContact: CAT[category].stop,
      });
    }catch(err){
      updateRecord(rec.id, {triage:{category:null, summary:"", error:err.message}});
    }
  };

  // ── Contact intake ──
  const parseContactsFromText = async()=>{
    if(!pasteText.trim()) return;
    if(!apiKey.trim()){ alert("Add your Anthropic API key in the Setup tab first."); return; }
    setParsing(true);
    setParsedPreview(null);
    try{
      const parsed = await callClaudeJSON(apiKey, `Extract all contact information from the text below. Return a JSON array of contacts. Each contact should have these fields: name, email, company, jobTitle, linkedIn, notes. Only include contacts where you can identify at least a name and email address. If a field is not present, use an empty string.

Text:
${pasteText}

Respond ONLY with a JSON array, no markdown, no explanation:
[{"name":"...","email":"...","company":"...","jobTitle":"...","linkedIn":"...","notes":"..."}]`, 2000);
      const withIds=(Array.isArray(parsed)?parsed:[]).filter(c=>c.name&&c.email).map(c=>({...c,id:uid()}));
      if(withIds.length===0){ alert("No contacts with both a name and email could be found. Try including email addresses in your text."); }
      else{ setParsedPreview(withIds); }
    }catch(e){
      alert(`Could not parse contacts: ${e.message}`);
    }
    setParsing(false);
  };

  const confirmParsed=()=>{
    setContacts(p=>[...p,...parsedPreview]);
    setParsedPreview(null);
    setPasteText("");
  };

  const addContact = ()=>{
    if(!newC.name.trim()||!newC.email.trim()) return;
    setContacts(p=>[...p,{...newC,id:uid()}]);
    setNewC({name:"",email:"",company:"",jobTitle:"",linkedIn:"",notes:""});
  };

  const handleCSV = (text)=>{
    const parsed = parseCSV(text);
    if(parsed.length===0){alert("No contacts found. Make sure your CSV has 'name' and 'email' columns.");return;}
    setContacts(p=>[...p,...parsed]);
  };

  const handleCSVFile = (file)=>{
    const r=new FileReader();
    r.onload=e=>handleCSV(e.target.result);
    r.readAsText(file);
  };

  // ── Cold email generation + send ──
  const generateEmail = (contact) =>
    callClaudeJSON(apiKey, coldEmailPrompt(campaign, userEmail, contact), 1000);

  const generateAll = async()=>{
    if(!apiKey.trim()){ alert("Add your Anthropic API key in the Setup tab first."); setTab("setup"); return; }
    setGenerating(true);setSendStatus({});setAllSent(false);
    const placeholders=contacts.map(c=>({contact:c,loading:true,subject:"",body:""}));
    setEmails(placeholders);setTab("emails");
    const result=[...placeholders];
    for(let i=0;i<contacts.length;i++){
      try{
        const parsed=await generateEmail(contacts[i]);
        result[i]={contact:contacts[i],loading:false,subject:parsed.subject,body:parsed.body};
      }catch(err){
        result[i]={contact:contacts[i],loading:false,subject:"Draft",body:`Could not generate (${err.message}) — edit manually.`,error:true};
      }
      setEmails([...result]);
    }
    setGenerating(false);
  };

  const regenOne = async(index)=>{
    setEmails(p=>{const n=[...p];n[index]={...n[index],loading:true};return n;});
    try{
      const parsed=await generateEmail(emails[index].contact);
      setEmails(p=>{const n=[...p];n[index]={...n[index],loading:false,subject:parsed.subject,body:parsed.body,error:false};return n;});
    }catch{
      setEmails(p=>{const n=[...p];n[index]={...n[index],loading:false};return n;});
    }
  };

  const handleEdit=(i,field,val)=>{
    setEmails(p=>{const n=[...p];n[i]={...n[i],[field]:val};return n;});
  };

  const sendAll=async()=>{
    setSending(true);
    const status={};
    const records=[];
    for(let i=0;i<emails.length;i++){
      const e=emails[i];
      if(e.loading||e.error){status[i]="skipped";setSendStatus({...status});continue;}
      status[i]="pending";setSendStatus({...status});
      const now = new Date().toISOString();
      const base = {
        id: uid(), contact: e.contact, subject: e.subject, body: e.body,
        sentAt: now, lastContactedAt: now,
        followUpCount: 0, followUps: [], doNotContact: false, reply: null, triage: null,
      };
      try{
        const result=await gmailSend(token,userEmail,e.contact.email,e.subject,e.body);
        status[i]="sent";
        records.push({...base, threadId: result.threadId || null, status: "sent"});
      }catch(err){
        status[i]=`error: ${err.message}`;
        records.push({...base, threadId: null, status: "error", errorMessage: err.message});
      }
      setSendStatus({...status});
      if(i<emails.length-1) await new Promise(r=>setTimeout(r,350));
    }
    setSentHistory(prev=>[...prev, ...records]);
    setSending(false);setAllSent(true);
  };

  // ── Follow-ups ──
  const followUpDays = Number(campaign.followUpDays) || DEFAULT_FOLLOWUP_DAYS;

  const dueFollowUps = useMemo(()=>{
    const now = new Date();
    return sentHistory
      .filter(r => r.status === "sent" && r.threadId && !r.doNotContact && !skipped.includes(r.id))
      .map(r => ({rec:r, days: businessDaysSince(r.lastContactedAt || r.sentAt, now)}))
      .filter(x => x.days >= followUpDays)
      .sort((a,b) => b.days - a.days);
  },[sentHistory, followUpDays, skipped]);

  const generateFollowUp = async(recId)=>{
    const rec = sentHistory.find(r=>r.id===recId);
    if(!rec) return;
    const days = businessDaysSince(rec.lastContactedAt || rec.sentAt);
    setFollowUpDrafts(p=>({...p,[recId]:{...(p[recId]||{}),loading:true,error:null}}));
    try{
      const out = await callClaudeJSON(apiKey, followUpPrompt(campaign, userEmail, rec, days), 800);
      const subject = /^re:/i.test(out.subject||"") ? out.subject : `Re: ${rec.subject}`;
      setFollowUpDrafts(p=>({...p,[recId]:{subject, body:out.body||"", loading:false, sent:false, error:null}}));
    }catch(err){
      setFollowUpDrafts(p=>({...p,[recId]:{
        subject:(p[recId]&&p[recId].subject)||`Re: ${rec.subject}`,
        body:(p[recId]&&p[recId].body)||"",
        loading:false, sent:false, error:`Could not draft: ${err.message}`,
      }}));
    }
  };

  const editFollowUp = (recId, field, val)=>{
    setFollowUpDrafts(p=>({...p,[recId]:{...p[recId],[field]:val}}));
  };

  const sendFollowUp = async(recId)=>{
    const rec = sentHistory.find(r=>r.id===recId);
    const draft = followUpDrafts[recId];
    if(!rec||!draft) return;
    setSendingFollowUp(recId);
    try{
      // Gmail needs threadId AND In-Reply-To/References to nest the reply properly.
      const parentId = await threadTailMessageId(token, rec.threadId).catch(()=>null);
      const headers = parentId ? {"In-Reply-To":parentId, "References":parentId} : {};
      await gmailSend(token, userEmail, rec.contact.email, draft.subject, draft.body, {threadId:rec.threadId, headers});
      const now = new Date().toISOString();
      updateRecord(recId, r=>({
        followUpCount:(r.followUpCount||0)+1,
        lastContactedAt: now,
        followUps:[...(r.followUps||[]), {subject:draft.subject, body:draft.body, sentAt:now}],
      }));
      setFollowUpDrafts(p=>({...p,[recId]:{...p[recId],sent:true,error:null}}));
    }catch(err){
      setFollowUpDrafts(p=>({...p,[recId]:{...p[recId],error:`Send failed: ${err.message}`}}));
    }
    setSendingFollowUp(null);
  };

  // ── Call prep ──
  const prepContact = contacts.find(c=>c.id===prepContactId) || null;

  const generatePrep = async()=>{
    if(!prepContact) return;
    if(!apiKey.trim()){ alert("Add your Anthropic API key in the Setup tab first."); setTab("setup"); return; }
    setPrepLoading(true); setPrepError(null); setPrepBrief(null);
    try{
      const history = sentHistory.find(r =>
        (r.contact?.email||"").toLowerCase() === (prepContact.email||"").toLowerCase()
      ) || null;
      const out = await callClaudeJSON(apiKey, callPrepPrompt(campaign, userEmail, prepContact, history), 1200);
      setPrepBrief({who:out.who||"", hook:out.hook||"", opener:out.opener||"", contactId:prepContact.id});
    }catch(err){
      setPrepError(err.message);
    }
    setPrepLoading(false);
  };

  // ── Derived counts ──
  const sentCount    = sentHistory.filter(r=>r.status==="sent"||r.status==="replied").length;
  const repliedCount = sentHistory.filter(r=>r.status==="replied").length;
  const errorCount   = sentHistory.filter(r=>r.status==="error").length;
  const interestedCount = sentHistory.filter(r=>r.triage?.category==="Interested").length;
  const canStep2 = campaign.senderName.trim()&&campaign.product.trim();
  const canSend  = !generating&&emails.length>0&&emails.every(e=>!e.loading)&&!sending&&!allSent;
  const origin   = window.location.origin;

  const replies = useMemo(()=>
    sentHistory
      .filter(r=>r.status==="replied" && r.reply)
      .slice()
      .sort((a,b)=>{
        const ra = CAT[a.triage?.category]?.rank ?? 99;
        const rb = CAT[b.triage?.category]?.rank ?? 99;
        if(ra !== rb) return ra - rb;
        return new Date(b.reply.receivedAt) - new Date(a.reply.receivedAt);
      })
  ,[sentHistory]);

  const tabs = token ? [
    {id:"campaign",  label:"Campaign"},
    {id:"contacts",  label:"Contacts",   badge:contacts.length||null},
    {id:"emails",    label:"Emails",     badge:emails.length||null},
    {id:"sent",      label:"Sent",       badge:sentCount||null},
    {id:"followups", label:"Follow-ups", badge:dueFollowUps.length||null},
    {id:"replies",   label:"Replies",    badge:repliedCount||null},
    {id:"prep",      label:"Call Prep"},
  ] : [];

  return (
    <div>
      <div className="header-bar">
        <div className="brand">✉ Ops Assistant</div>
        {token && (
          <div className="user-chip">
            <div className="avatar avatar-sm" style={{width:26,height:26,fontSize:10}}>{initials(userEmail.split("@")[0])}</div>
            <span>{userEmail}</span>
            {polling && <span className="spin" title="Checking for replies">⟳</span>}
            {notifPermission==="granted"&&<span title="Reply notifications active" style={{color:"#6366f1"}}>🔔</span>}
          </div>
        )}
        {!token && reconnecting && (
          <div className="user-chip">
            <span className="spin" style={{fontSize:14}}>⟳</span>
            <span className="muted small">Reconnecting…</span>
          </div>
        )}
      </div>

      {token && (
        <div className="tab-bar">
          {tabs.map(t=>(
            <button key={t.id} className={`tab${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
              {t.label}
              {t.badge?<span className="tab-badge">{t.badge}</span>:null}
            </button>
          ))}
        </div>
      )}

      {/* ── SETUP ─────────────────────────────────────────────────────── */}
      {tab==="setup"&&(
        <div className="flex-col fade-in">
          {gisError&&<div className="card-danger">Could not load Google's auth library. Open this file via a local server — see the note below.</div>}

          <div className="card flex-col">
            <div className="flex-between">
              <p style={{fontSize:15,fontWeight:600}}>Connect Claude</p>
              {apiKey.trim()&&<span className="status-pill pill-sent">✓ Key saved</span>}
            </div>
            <div>
              <label>Anthropic API key</label>
              <input type="password" placeholder="sk-ant-…" value={apiKey} onChange={e=>setApiKey(e.target.value)} style={{fontFamily:"monospace",fontSize:12}}/>
              <p className="small muted mt-4">Stored only in this browser — never sent anywhere except api.anthropic.com.</p>
            </div>
          </div>
          <div className="card-accent">
            <p style={{fontWeight:600,marginBottom:8}}>🔑 Get your API key (one-time, ~2 minutes)</p>
            <ol className="setup">
              <li>Go to <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → sign in or sign up</li>
              <li>Go to <strong>Settings → API Keys</strong></li>
              <li>Click <strong>Create Key</strong>, name it, and copy it</li>
              <li>Add a small credit balance under <strong>Billing</strong> (outreach emails cost a fraction of a cent each)</li>
              <li>Paste the key above</li>
            </ol>
          </div>

          <div className="card flex-col">
            <p style={{fontSize:15,fontWeight:600}}>Connect your Gmail account</p>
            <div>
              <label>OAuth Client ID</label>
              <input placeholder="123456789-abc….apps.googleusercontent.com" value={clientId} onChange={e=>setClientId(e.target.value)} style={{fontFamily:"monospace",fontSize:12}}/>
            </div>
            <div>
              <button className="btn-primary" onClick={connectGmail} disabled={!gisReady||!clientId.trim()}>
                {!gisReady&&!gisError?<><span className="spin">⟳</span>Loading…</>:<>🔐 Authorize Gmail</>}
              </button>
            </div>
          </div>
          <div className="card-accent">
            <p style={{fontWeight:600,marginBottom:8}}>⚙️ One-time Google Cloud setup</p>
            <ol className="setup">
              <li>Go to <a href="https://console.cloud.google.com" target="_blank">console.cloud.google.com</a> → create a project</li>
              <li>APIs &amp; Services → Library → enable <strong>Gmail API</strong></li>
              <li>APIs &amp; Services → OAuth consent screen → External → add yourself as a test user</li>
              <li>Credentials → Create → OAuth client ID → Web application</li>
              <li>Authorized JavaScript origins: <code className="inline">{origin}</code></li>
              <li>Copy the Client ID and paste above</li>
            </ol>
          </div>
          <div className="card-warning">
            📁 <strong>Running locally?</strong> Run <code style={{background:"rgba(0,0,0,.08)",padding:"1px 6px",borderRadius:4,fontFamily:"monospace",fontSize:12}}>python3 -m http.server 8080</code> in the file's folder, open <strong>http://localhost:8080/index.html</strong>, and use <code className="inline">http://localhost:8080</code> as your authorized origin.
          </div>

          <div className="card flex-col" style={{borderColor:"#fca5a5"}}>
            <div className="flex-between">
              <div>
                <p style={{fontSize:14,fontWeight:500,color:"#dc2626"}}>Clear all saved data</p>
                <p className="small muted">Removes your API key, Client ID, campaign settings, contacts, and send history from this browser.</p>
              </div>
              {!showClearConfirm
                ? <button className="btn-danger" onClick={()=>setShowClearConfirm(true)}>Clear data</button>
                : <div className="flex-row gap-8">
                    <span className="small" style={{color:"#dc2626",fontWeight:500}}>Are you sure?</span>
                    <button className="btn-danger" onClick={clearAllData}>Yes, clear</button>
                    <button className="btn-secondary" onClick={()=>setShowClearConfirm(false)}>Cancel</button>
                  </div>
              }
            </div>
          </div>
        </div>
      )}

      {/* ── CAMPAIGN ──────────────────────────────────────────────────── */}
      {tab==="campaign"&&(
        <div className="flex-col fade-in">
          <div className="card-success">✓ Connected as <strong>{userEmail}</strong>{notifPermission==="granted"?" · Reply notifications on":""}</div>
          <div className="card flex-col">
            <p style={{fontSize:15,fontWeight:600}}>Campaign settings</p>
            <div>
              <label>Your name</label>
              <input value={campaign.senderName} onChange={e=>setCampaign(p=>({...p,senderName:e.target.value}))} placeholder="Alex Johnson"/>
            </div>
            <div>
              <label>What are you selling? <span className="muted small">The more detail, the better Claude personalises</span></label>
              <textarea value={campaign.product} onChange={e=>setCampaign(p=>({...p,product:e.target.value}))} rows={4} placeholder="E.g. A B2B analytics tool that helps e-commerce teams identify at-risk customers 30 days before they churn. Integrates with Shopify in one click. Key differentiator: no data scientists needed." style={{resize:"vertical"}}/>
            </div>
            <div>
              <label>Subject line direction <span className="muted small">— optional hint for Claude</span></label>
              <input value={campaign.subjectHint} onChange={e=>setCampaign(p=>({...p,subjectHint:e.target.value}))} placeholder='E.g. "lead with a pain-point question" or "keep it under 8 words"'/>
            </div>
            <div>
              <label className="mb-8">Email tone</label>
              <div className="grid-2">
                {TONES.map(t=>(
                  <button key={t} className={`tone-btn${campaign.tone===t?" active":""}`} onClick={()=>setCampaign(p=>({...p,tone:t}))}>
                    <p style={{fontSize:13,fontWeight:500,color:campaign.tone===t?"#4347b5":"#1a1d2e"}}>{t}</p>
                    <p className="small" style={{color:campaign.tone===t?"#6366f1":"#9198b0",marginTop:2}}>{TONE_DESC[t]}</p>
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="card flex-col">
            <p style={{fontSize:15,fontWeight:600}}>Follow-up nudges</p>
            <div>
              <label>Flag a contact after this many business days with no reply</label>
              <div className="flex-row gap-10">
                <input type="number" min="1" max="60" value={campaign.followUpDays}
                  onChange={e=>setCampaign(p=>({...p,followUpDays:e.target.value===""?"":Math.max(1,Math.min(60,Number(e.target.value)))}))}/>
                <span className="small muted">business days — weekends are skipped</span>
              </div>
              <p className="small muted mt-8">
                Contacts who replied — or whose reply was tagged Not Interested, Unsubscribe, Wrong Person, or Referral — are never surfaced for follow-up.
              </p>
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <button className="btn-primary" onClick={()=>setTab("contacts")} disabled={!canStep2}>Add contacts →</button>
          </div>
        </div>
      )}

      {/* ── CONTACTS ──────────────────────────────────────────────────── */}
      {tab==="contacts"&&(
        <div className="flex-col fade-in">
          {!apiKey.trim()&&(
            <div className="card-warning flex-between">
              <span>🔑 Add your Anthropic API key to use AI-powered paste parsing and email generation.</span>
              <button className="btn-ghost" onClick={()=>setTab("setup")}>Go to Setup</button>
            </div>
          )}
          <div className="card flex-col">
            <p style={{fontSize:15,fontWeight:600}}>Import contacts</p>
            <div
              className={`csv-zone${csvDrag?" over":""}`}
              onDragOver={e=>{e.preventDefault();setCsvDrag(true)}}
              onDragLeave={()=>setCsvDrag(false)}
              onDrop={e=>{e.preventDefault();setCsvDrag(false);const f=e.dataTransfer.files[0];if(f)handleCSVFile(f);}}
              onClick={()=>document.getElementById("csvInput").click()}
            >
              <p style={{fontSize:14,fontWeight:500,color:"#4a5070",marginBottom:4}}>📂 Drop a CSV file here, or click to browse</p>
              <p className="small muted">Columns: name, email, company, jobTitle, linkedIn, notes</p>
              <input id="csvInput" type="file" accept=".csv" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleCSVFile(e.target.files[0])}}/>
            </div>
          </div>

          <div className="card flex-col">
            <div className="flex-between">
              <p style={{fontSize:15,fontWeight:600}}>Paste a list</p>
              <span className="small muted">Any format — Claude figures it out</span>
            </div>
            <textarea
              placeholder={`Paste anything — spreadsheet rows, LinkedIn profiles, email signatures, a messy list — Claude will extract the contacts.\n\nExamples:\n  Jane Smith, jane@acme.com, Head of Marketing, Acme Corp\n  John Doe | john@startup.io | CEO\n  Bob Lee\n  bob@company.com\n  VP Sales at TechCo`}
              value={pasteText}
              onChange={e=>setPasteText(e.target.value)}
              rows={8}
              style={{resize:"vertical",fontFamily:"monospace",fontSize:12,lineHeight:1.6}}
            />
            {parsedPreview&&(
              <div style={{background:"#eef0fd",border:"1px solid #c7caff",borderRadius:10,padding:"12px 14px"}}>
                <div className="flex-between mb-8">
                  <p style={{fontSize:13,fontWeight:600,color:"#4347b5"}}>✦ Claude found {parsedPreview.length} contact{parsedPreview.length!==1?"s":""}</p>
                  <button className="btn-icon" style={{color:"#9198b0"}} onClick={()=>setParsedPreview(null)}>✕</button>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                  {parsedPreview.map((c,i)=>(
                    <div key={i} style={{background:"#fff",borderRadius:8,padding:"8px 12px",display:"flex",alignItems:"center",gap:8}}>
                      <div className="avatar avatar-sm" style={{width:28,height:28,fontSize:10}}>{initials(c.name)}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{fontSize:13,fontWeight:500}}>{c.name}{c.jobTitle?<span className="muted small"> · {c.jobTitle}</span>:null}</p>
                        <p className="small muted" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}{c.company?` · ${c.company}`:""}</p>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex-row gap-8">
                  <button className="btn-primary" style={{fontSize:13,padding:"8px 16px"}} onClick={confirmParsed}>+ Add all {parsedPreview.length}</button>
                  <button className="btn-secondary" style={{fontSize:13}} onClick={()=>setParsedPreview(null)}>Discard</button>
                </div>
              </div>
            )}
            <div>
              <button className="btn-primary" onClick={parseContactsFromText} disabled={!pasteText.trim()||parsing}>
                {parsing?<><span className="spin">⟳</span>Parsing…</>:<>✦ Parse with AI</>}
              </button>
            </div>
          </div>

          <div className="card flex-col">
            <p style={{fontSize:15,fontWeight:600}}>Add manually</p>
            <div className="grid-2">
              {[
                {k:"name",l:"Name *",p:"Jane Smith"},
                {k:"email",l:"Email *",p:"jane@company.com",t:"email"},
                {k:"company",l:"Company",p:"Acme Corp"},
                {k:"jobTitle",l:"Job title",p:"Head of Marketing"},
                {k:"linkedIn",l:"LinkedIn URL",p:"linkedin.com/in/jane"},
                {k:"notes",l:"Personalisation notes",p:"Met at SaaS Summit; uses HubSpot"},
              ].map(f=>(
                <div key={f.k}>
                  <label>{f.l}</label>
                  <input type={f.t||"text"} placeholder={f.p} value={newC[f.k]} onChange={e=>setNewC(p=>({...p,[f.k]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addContact()}/>
                </div>
              ))}
            </div>
            <div><button className="btn-secondary" onClick={addContact} disabled={!newC.name.trim()||!newC.email.trim()}>+ Add contact</button></div>
          </div>

          {contacts.length>0?(
            <div>
              <div className="flex-between mb-8">
                <p className="small muted">{contacts.length} contact{contacts.length!==1?"s":""} added</p>
                <button className="btn-danger" onClick={()=>setContacts([])}>✕ Clear all</button>
              </div>
              <div className="flex-col" style={{gap:8}}>
                {contacts.map(c=>(
                  <div key={c.id} className="contact-row">
                    <div className="avatar avatar-sm">{initials(c.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <p style={{fontSize:13,fontWeight:500}}>{c.name}{c.jobTitle?<span className="muted small"> · {c.jobTitle}</span>:null}</p>
                      <p className="small muted" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}{c.company?` · ${c.company}`:""}{c.notes?` · ${c.notes}`:""}</p>
                    </div>
                    <button className="btn-icon" onClick={()=>setContacts(p=>p.filter(x=>x.id!==c.id))} title="Remove">✕</button>
                  </div>
                ))}
              </div>
            </div>
          ):(
            <div style={{textAlign:"center",padding:"2rem",border:"1px dashed #dde1ec",borderRadius:12,color:"#9198b0",fontSize:14}}>
              No contacts yet — paste a list, import a CSV, or add manually above.
            </div>
          )}

          <div className="flex-between">
            <button className="btn-secondary" onClick={()=>setTab("campaign")}>← Back</button>
            <button className="btn-primary" onClick={generateAll} disabled={contacts.length===0}>
              ✦ Generate {contacts.length||""} email{contacts.length!==1?"s":""}
            </button>
          </div>
        </div>
      )}

      {/* ── EMAILS ────────────────────────────────────────────────────── */}
      {tab==="emails"&&(
        <div className="flex-col fade-in">
          {emails.length===0 ? (
            <Empty title="No drafts in progress" hint="Go to Contacts and generate a batch to start a campaign."/>
          ) : (
            <>
              <div style={{
                display:"flex",alignItems:"center",justifyContent:"space-between",
                padding:"12px 16px",borderRadius:12,
                background:allSent?"#ecfdf5":generating?"#fffbeb":"#fff",
                border:`1px solid ${allSent?"#86efac":generating?"#fcd34d":"#e4e7f0"}`,
              }}>
                <div className="flex-row gap-8">
                  {generating&&<span className="spin">⟳</span>}
                  {allSent&&<span>✓</span>}
                  <span style={{fontSize:14,fontWeight:500,color:generating?"#92400e":allSent?"#166534":"#1a1d2e"}}>
                    {generating?`Writing… ${emails.filter(e=>!e.loading).length}/${emails.length}`
                      :allSent?`Batch sent — now tracked in Sent`
                      :`${emails.length} email${emails.length!==1?"s":""} ready`}
                  </span>
                </div>
                <div className="flex-row gap-8">
                  {!generating&&!allSent&&!sending&&(
                    <button className="btn-secondary" onClick={generateAll}>↺ Regen all</button>
                  )}
                  {canSend&&(
                    <button className="btn-send" onClick={sendAll}>➤ Send all {emails.length}</button>
                  )}
                  {sending&&<span className="small muted"><span className="spin">⟳</span> Sending…</span>}
                </div>
              </div>

              <div className="flex-col" style={{gap:10}}>
                {emails.map((item,i)=>(
                  <EmailCard key={i} item={item} index={i} status={sendStatus[i]} onEdit={handleEdit} onRegenerate={regenOne} disabled={!!sendStatus[i]}/>
                ))}
              </div>

              {!generating&&!allSent&&(
                <div style={{display:"flex",justifyContent:"flex-start"}}>
                  <button className="btn-secondary" onClick={()=>setTab("contacts")}>← Edit contacts</button>
                </div>
              )}
              {allSent&&(
                <div style={{display:"flex",justifyContent:"center"}}>
                  <button className="btn-secondary" onClick={()=>{setEmails([]);setSendStatus({});setAllSent(false);setTab("sent");}}>
                    Clear drafts and view dashboard →
                  </button>
                </div>
              )}
            </>
          )}
        </div>
      )}

      {/* ── SENT DASHBOARD ────────────────────────────────────────────── */}
      {tab==="sent"&&(
        <div className="flex-col fade-in">
          {sentHistory.length===0?(
            <Empty title="No emails sent yet" hint="Go to Contacts to start a campaign."/>
          ):(
            <>
              <div className="grid-3" style={{gap:10}}>
                {[
                  {label:"Sent",value:sentCount,color:"#166534",bg:"#ecfdf5",border:"#86efac"},
                  {label:"Replied",value:repliedCount,color:"#4347b5",bg:"#eef0fd",border:"#c7caff"},
                  {label:"Reply rate",value:sentCount?`${Math.round(repliedCount/sentCount*100)}%`:"—",color:"#1a1d2e",bg:"#fff",border:"#e4e7f0"},
                ].map(s=>(
                  <div key={s.label} style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:12,padding:"1rem",textAlign:"center"}}>
                    <p style={{fontSize:26,fontWeight:600,color:s.color}}>{s.value}</p>
                    <p className="small muted">{s.label}</p>
                  </div>
                ))}
              </div>

              {errorCount>0 && <div className="card-warning">{errorCount} email{errorCount!==1?"s":""} failed to send. They are listed below and are not tracked for follow-up.</div>}

              {notifPermission!=="granted"&&(
                <div className="card-warning">
                  🔔 <strong>Enable browser notifications</strong> to get alerted when someone replies.{" "}
                  <button className="btn-ghost" style={{marginLeft:8}} onClick={()=>Notification.requestPermission().then(p=>setNotifPermission(p))}>Enable</button>
                </div>
              )}
              {pollableCount>0&&(
                <div className="card-success">
                  🔔 Watching {pollableCount} thread{pollableCount!==1?"s":""} for replies, every 5 minutes. This resumes automatically whenever you open the app.
                </div>
              )}

              <div className="flex-col" style={{gap:8}}>
                {sentHistory.slice().reverse().map(rec=>(
                  <div key={rec.id} className={`email-card${rec.status==="replied"?" replied":rec.status==="sent"?" sent":rec.status==="error"?" error":""}`}>
                    <ContactLine contact={rec.contact} right={<>
                      {rec.triage?.category && <Tag category={rec.triage.category}/>}
                      <StatusPill status={rec.status}/>
                    </>}/>
                    <p className="small muted mt-8" style={{paddingLeft:40}}>
                      {fmtDate(rec.sentAt)} · Subject: {rec.subject}
                      {rec.followUpCount>0 && ` · ${rec.followUpCount} follow-up${rec.followUpCount!==1?"s":""}`}
                      {rec.doNotContact && " · follow-ups stopped"}
                    </p>
                    {rec.errorMessage && <div className="card-danger mt-8" style={{marginLeft:40}}>{rec.errorMessage}</div>}
                    {rec.reply&&(
                      <div className="reply-banner" style={{marginLeft:40}}>
                        💬 <strong>Their reply:</strong> “{rec.reply.snippet || rec.reply.bodyText.slice(0,160)}”
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {/* ── FOLLOW-UPS ────────────────────────────────────────────────── */}
      {tab==="followups"&&(
        <div className="flex-col fade-in">
          <div className="card flex-between">
            <div>
              <p style={{fontSize:15,fontWeight:600}}>Gone quiet</p>
              <p className="small muted mt-4">
                {dueFollowUps.length === 0
                  ? `Nobody has been silent for ${followUpDays}+ business days.`
                  : `${dueFollowUps.length} contact${dueFollowUps.length!==1?"s":""} with no reply after ${followUpDays}+ business days.`}
              </p>
            </div>
            <button className="btn-ghost" onClick={()=>setTab("campaign")}>Change threshold</button>
          </div>

          {!apiKey.trim()&&(
            <div className="card-warning flex-between">
              <span>🔑 Add your Anthropic API key to draft follow-ups.</span>
              <button className="btn-ghost" onClick={()=>setTab("setup")}>Go to Setup</button>
            </div>
          )}

          {sentHistory.length===0 ? (
            <Empty title="Nothing to follow up on yet" hint="Send a batch first — contacts appear here once they go quiet."/>
          ) : dueFollowUps.length===0 ? (
            <Empty title="All clear" hint={`No contact has been waiting ${followUpDays}+ business days without a reply.`}/>
          ) : (
            <div className="flex-col" style={{gap:10}}>
              {dueFollowUps.map(({rec, days})=>(
                <FollowUpCard
                  key={rec.id} rec={rec} days={days}
                  draft={followUpDrafts[rec.id]}
                  onGenerate={generateFollowUp}
                  onEdit={editFollowUp}
                  onSend={sendFollowUp}
                  onSkip={id=>setSkipped(s=>[...s,id])}
                  sending={sendingFollowUp===rec.id}
                  apiKeyMissing={!apiKey.trim()}
                />
              ))}
            </div>
          )}

          {skipped.length>0 && (
            <p className="small muted" style={{textAlign:"center"}}>
              {skipped.length} skipped this session ·{" "}
              <button className="btn-ghost" onClick={()=>setSkipped([])}>Show again</button>
            </p>
          )}
        </div>
      )}

      {/* ── REPLIES (TRIAGE) ──────────────────────────────────────────── */}
      {tab==="replies"&&(
        <div className="flex-col fade-in">
          <div className="card flex-between">
            <div>
              <p style={{fontSize:15,fontWeight:600}}>Inbox triage</p>
              <p className="small muted mt-4">
                {replies.length === 0 ? "No replies yet." :
                  `${replies.length} repl${replies.length!==1?"ies":"y"}${interestedCount?` · ${interestedCount} interested`:""}`}
              </p>
            </div>
            <button className="btn-ghost" onClick={pollReplies} disabled={polling||!token}>
              {polling?<><span className="spin">⟳</span>Checking…</>:"↻ Check now"}
            </button>
          </div>

          {replies.length===0 ? (
            <Empty title="No replies yet" hint="Replies are picked up every 5 minutes and tagged automatically."/>
          ) : (
            <div className="flex-col" style={{gap:8}}>
              {replies.map(rec=>{
                const cat = rec.triage?.category;
                const cls = cat === "Interested" ? "hot" : rec.doNotContact ? "stopped" : "replied";
                return (
                  <div key={rec.id} className={`email-card ${cls}`}>
                    <ContactLine contact={rec.contact} right={<>
                      {cat ? <Tag category={cat}/> :
                        rec.triage?.loading ? <Spinner/> :
                        <span className="status-pill pill-pending">untagged</span>}
                      <span className="small muted">{fmtDate(rec.reply.receivedAt)}</span>
                    </>}/>

                    <p style={{fontSize:13.5,marginTop:8,paddingLeft:40,color:"#2b3048"}}>
                      {rec.triage?.summary
                        ? rec.triage.summary
                        : <span className="muted">{(rec.reply.bodyText||rec.reply.snippet||"").slice(0,140)}…</span>}
                    </p>

                    {rec.triage?.error && (
                      <p className="small" style={{color:"#991b1b",paddingLeft:40,marginTop:6}}>Tagging failed: {rec.triage.error}</p>
                    )}

                    <div className="flex-row gap-8 mt-8" style={{paddingLeft:40}}>
                      <button className="btn-ghost" onClick={()=>retriage(rec)} disabled={!apiKey.trim()||!!rec.triage?.loading}>
                        {cat?"↺ Re-tag":"✦ Tag it"}
                      </button>
                      <details style={{flex:1}}>
                        <summary className="small muted" style={{cursor:"pointer"}}>Read full reply</summary>
                        <p className="small" style={{whiteSpace:"pre-wrap",marginTop:8,color:"#4a5070",maxHeight:260,overflow:"auto"}}>
                          {rec.reply.bodyText || rec.reply.snippet}
                        </p>
                      </details>
                    </div>

                    {rec.doNotContact && (
                      <p className="small muted mt-8" style={{paddingLeft:40}}>
                        ⛔ Follow-ups stopped for this contact.
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ── CALL PREP ─────────────────────────────────────────────────── */}
      {tab==="prep"&&(
        <div className="flex-col fade-in">
          <div className="card flex-col">
            <p style={{fontSize:15,fontWeight:600}}>Call prep brief</p>
            <p className="small muted">Pick a contact, then generate a short brief to read right before you dial.</p>

            {contacts.length===0 ? (
              <div className="card-warning flex-between">
                <span>No contacts loaded. Import a CSV or add one in the Contacts tab.</span>
                <button className="btn-ghost" onClick={()=>setTab("contacts")}>Go to Contacts</button>
              </div>
            ) : (
              <div className="flex-col" style={{gap:8,maxHeight:280,overflow:"auto"}}>
                {contacts.map(c=>(
                  <div key={c.id}
                    className={`contact-row selectable${prepContactId===c.id?" selected":""}`}
                    onClick={()=>{setPrepContactId(c.id);setPrepBrief(null);setPrepError(null);}}>
                    <div className="avatar avatar-sm">{initials(c.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <p style={{fontSize:13,fontWeight:500}}>{c.name}{c.jobTitle?<span className="muted small"> · {c.jobTitle}</span>:null}</p>
                      <p className="small muted" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}{c.company?` · ${c.company}`:""}</p>
                    </div>
                    {prepContactId===c.id && <span style={{color:"#6366f1",fontSize:14}}>✓</span>}
                  </div>
                ))}
              </div>
            )}

            <div className="flex-row gap-8">
              <button className="btn-primary" onClick={generatePrep} disabled={!prepContact||prepLoading||!apiKey.trim()}>
                {prepLoading?<><span className="spin">⟳</span>Prepping…</>:<>✦ Generate brief</>}
              </button>
              {!apiKey.trim() && <span className="small muted">Add your API key in Setup first.</span>}
            </div>
          </div>

          {prepError && <div className="card-danger">Could not generate brief: {prepError}</div>}

          {prepBrief && prepContact && (
            <div className="brief fade-in">
              <div className="flex-between mb-12">
                <div className="flex-row gap-10">
                  <div className="avatar">{initials(prepContact.name)}</div>
                  <div>
                    <p style={{fontSize:15,fontWeight:600}}>{prepContact.name}</p>
                    <p className="small muted">{prepContact.jobTitle||"—"}{prepContact.company?` · ${prepContact.company}`:""}</p>
                  </div>
                </div>
                <button className="btn-ghost" onClick={generatePrep} disabled={prepLoading}>↺ Redo</button>
              </div>
              <section>
                <h4>Who you're talking to</h4>
                <p>{prepBrief.who}</p>
              </section>
              <section>
                <h4>Your hook</h4>
                <p>{prepBrief.hook}</p>
              </section>
              <section>
                <h4>Opening line</h4>
                <p className="opener">“{prepBrief.opener}”</p>
              </section>
            </div>
          )}
        </div>
      )}

      <p style={{textAlign:"center",fontSize:12,color:"#c5c8d8",marginTop:"2.5rem"}}>Powered by Claude · Sends via Gmail</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
